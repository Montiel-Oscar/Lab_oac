<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carta ASM Recursiva</title>
  <style>
    :root{
      --bg:#f5f8ff;
      --panel:#ffffff;
      --line:#22324d;
      --state:#dfeeff;
      --decision:#fff2c9;
      --cond:#d8f8e6;
      --text:#17243a;
      --muted:#5a6a84;
      --accent:#2b6cff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#f7faff 0%,#eef4ff 100%);
      color:var(--text);
    }
    .wrap{
      max-width:1500px;
      margin:24px auto;
      padding:0 18px;
    }
    .card{
      background:var(--panel);
      border:1px solid #e7eef8;
      border-radius:20px;
      padding:22px;
      box-shadow:0 10px 30px rgba(28,49,87,.10);
    }
    h1{
      margin:0 0 8px;
      font-size:30px;
    }
    p{
      margin:0 0 14px;
      color:var(--muted);
      line-height:1.5;
    }
    .legend{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:16px;
      color:var(--muted);
      font-size:13px;
    }
    .legend span{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#f8fbff;
      border:1px solid #e7eef8;
    }
    .tag{
      width:14px;
      height:14px;
      border-radius:4px;
      border:1px solid rgba(0,0,0,.12);
      display:inline-block;
    }
    svg{
      width:100%;
      height:auto;
      border:1px solid #edf2fa;
      border-radius:18px;
      background:#fcfdff;
    }
    .state{
      fill:var(--state);
      stroke:var(--line);
      stroke-width:2.3;
      rx:18;
      ry:18;
    }
    .decision{
      fill:var(--decision);
      stroke:var(--line);
      stroke-width:2.3;
    }
    .cond{
      fill:var(--cond);
      stroke:var(--line);
      stroke-width:2;
      rx:12;
      ry:12;
    }
    .edge{
      stroke:var(--line);
      stroke-width:2.6;
      fill:none;
      marker-end:url(#arrow);
      stroke-linejoin:round;
      stroke-linecap:round;
    }
    .soft{stroke-width:2.2}
    .title{
      font-size:20px;
      font-weight:800;
      fill:var(--text);
      text-anchor:middle;
    }
    .subtitle{
      font-size:12px;
      fill:var(--muted);
      text-anchor:middle;
    }
    .box-title{
      font-size:20px;
      font-weight:800;
      fill:var(--text);
      text-anchor:middle;
    }
    .box-text{
      font-size:14px;
      fill:var(--text);
      text-anchor:middle;
    }
    .decision-text{
      font-size:18px;
      font-weight:800;
      fill:var(--text);
      text-anchor:middle;
    }
    .cond-text{
      font-size:14px;
      font-weight:800;
      fill:#125135;
      text-anchor:middle;
    }
    .label{
      font-size:15px;
      font-weight:800;
      fill:var(--accent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Carta ASM recursiva</h1>
      <p>
        Máquina ASM de 6 estados, 3 entradas y 4 salidas. El flujo es recursivo:
        el estado final regresa al estado inicial y varios estados intermedios vuelven a <strong>S0</strong>
        bajo ciertas condiciones.
      </p>

      <div class="legend">
        <span><i class="tag" style="background:#dfeeff"></i> Estado</span>
        <span><i class="tag" style="background:#fff2c9"></i> Decisión</span>
        <span><i class="tag" style="background:#d8f8e6"></i> Salida condicional</span>
        <span><strong>Y3_n</strong> y <strong>Y4_n</strong> están en lógica negada</span>
      </div>

      <svg viewBox="0 0 1500 1320" aria-label="Carta ASM recursiva">
        <defs>
          <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M0 0 L12 6 L0 12 Z" fill="#22324d"></path>
          </marker>
        </defs>

        <text x="750" y="36" class="title">Diagrama ASM completo</text>
        <text x="750" y="60" class="subtitle">Entradas: A, B, C • Salidas: Y1, Y2, Y3_n, Y4_n</text>

        <!-- S0 -->
        <rect x="585" y="90" width="330" height="100" class="state"/>
        <text x="750" y="128" class="box-title">S0 (000)</text>
        <text x="750" y="155" class="box-text">Y1=0, Y2=0, Y3_n=1, Y4_n=1</text>

        <!-- A? -->
        <path d="M750 190 L810 245 L750 300 L690 245 Z" class="decision"/>
        <text x="750" y="252" class="decision-text">A ?</text>

        <!-- S1 -->
        <rect x="170" y="360" width="300" height="100" class="state"/>
        <text x="320" y="398" class="box-title">S1 (001)</text>
        <text x="320" y="425" class="box-text">Y1=0, Y2=0, Y3_n=1, Y4_n=1</text>

        <!-- S2 -->
        <rect x="1030" y="360" width="300" height="100" class="state"/>
        <text x="1180" y="398" class="box-title">S2 (010)</text>
        <text x="1180" y="425" class="box-text">Y1=0, Y2=0, Y3_n=1, Y4_n=1</text>

        <!-- B? under S1 -->
        <path d="M320 460 L380 515 L320 570 L260 515 Z" class="decision"/>
        <text x="320" y="522" class="decision-text">B ?</text>

        <!-- C? under S2 -->
        <path d="M1180 460 L1240 515 L1180 570 L1120 515 Z" class="decision"/>
        <text x="1180" y="522" class="decision-text">C ?</text>

        <!-- S3 -->
        <rect x="170" y="680" width="300" height="100" class="state"/>
        <text x="320" y="718" class="box-title">S3 (011)</text>
        <text x="320" y="745" class="box-text">Y1=1, Y2=0, Y3_n=1, Y4_n=1</text>

        <!-- S4 -->
        <rect x="1030" y="680" width="300" height="100" class="state"/>
        <text x="1180" y="718" class="box-title">S4 (100)</text>
        <text x="1180" y="745" class="box-text">Y1=0, Y2=0, Y3_n=1, Y4_n=1</text>

        <!-- A? under S3 -->
        <path d="M320 780 L380 835 L320 890 L260 835 Z" class="decision"/>
        <text x="320" y="842" class="decision-text">A ?</text>

        <!-- B? under S4 -->
        <path d="M1180 780 L1240 835 L1180 890 L1120 835 Z" class="decision"/>
        <text x="1180" y="842" class="decision-text">B ?</text>

        <!-- second decision under S2 -->
        <path d="M1180 600 L1240 655 L1180 710 L1120 655 Z" class="decision"/>
        <text x="1180" y="662" class="decision-text">B ?</text>

        <!-- S5 -->
        <rect x="585" y="1010" width="330" height="100" class="state"/>
        <text x="750" y="1048" class="box-title">S5 (101)</text>
        <text x="750" y="1075" class="box-text">Y1=0, Y2=1, Y3_n=1, Y4_n=1</text>

        <!-- C? under S5 -->
        <path d="M750 1110 L810 1165 L750 1220 L690 1165 Z" class="decision"/>
        <text x="750" y="1172" class="decision-text">C ?</text>

        <!-- Conditional output boxes -->
        <rect x="1270" y="615" width="135" height="52" class="cond"/>
        <text x="1337" y="647" class="cond-text">Y1 = 1</text>

        <rect x="410" y="905" width="135" height="52" class="cond"/>
        <text x="477" y="937" class="cond-text">Y2 = 1</text>

        <rect x="1260" y="905" width="145" height="52" class="cond"/>
        <text x="1332" y="937" class="cond-text">Y3_n = 0</text>

        <rect x="965" y="1138" width="145" height="52" class="cond"/>
        <text x="1037" y="1170" class="cond-text">Y4_n = 0</text>

        <!-- Connections -->
        <!-- S0 to A? -->
        <path d="M750 190 L750 245" class="edge"/>

        <!-- A=0 to S1 -->
        <path d="M690 245 C540 245, 410 280, 320 360" class="edge"/>
        <text x="540" y="255" class="label">0</text>

        <!-- A=1 to S2 -->
        <path d="M810 245 C960 245, 1090 280, 1180 360" class="edge"/>
        <text x="945" y="255" class="label">1</text>

        <!-- S1 to B? -->
        <path d="M320 460 L320 515" class="edge"/>

        <!-- B=0 to S3 -->
        <path d="M320 570 L320 680" class="edge"/>
        <text x="332" y="632" class="label">0</text>

        <!-- B=1 back to S0 -->
        <path d="M260 515 C120 515, 110 140, 585 140" class="edge soft"/>
        <text x="140" y="500" class="label">1</text>

        <!-- S2 to C? -->
        <path d="M1180 460 L1180 515" class="edge"/>

        <!-- C=0 to S4 -->
        <path d="M1120 515 C1070 515, 1060 610, 1180 680" class="edge"/>
        <text x="1088" y="540" class="label">0</text>

        <!-- C=1 to B? -->
        <path d="M1180 570 L1180 600" class="edge"/>
        <text x="1195" y="590" class="label">1</text>

        <!-- second B=0 to Y1 cond then S5 -->
        <path d="M1240 655 L1337 655" class="edge"/>
        <text x="1262" y="642" class="label">0</text>
        <path d="M1337 667 L1337 920 L915 920 L915 1010" class="edge"/>

        <!-- second B=1 back to S0 -->
        <path d="M1120 655 C980 655, 980 140, 915 140" class="edge soft"/>
        <text x="1040" y="640" class="label">1</text>

        <!-- S3 to A? -->
        <path d="M320 780 L320 835" class="edge"/>

        <!-- A=0 to S5 -->
        <path d="M380 835 C520 835, 640 900, 750 1010" class="edge"/>
        <text x="505" y="824" class="label">0</text>

        <!-- A=1 to Y2 cond then S0 -->
        <path d="M320 890 L320 931 L410 931" class="edge"/>
        <text x="334" y="906" class="label">1</text>
        <path d="M545 931 C620 931, 620 220, 690 220" class="edge"/>

        <!-- S4 to B? -->
        <path d="M1180 780 L1180 835" class="edge"/>

        <!-- B=0 to Y3_n cond then S5 -->
        <path d="M1240 835 L1332 835 L1332 905" class="edge"/>
        <text x="1265" y="824" class="label">0</text>
        <path d="M1332 957 L1332 980 L915 980 L915 1010" class="edge"/>

        <!-- B=1 back to S0 -->
        <path d="M1120 835 C980 835, 980 190, 915 190" class="edge soft"/>
        <text x="1042" y="820" class="label">1</text>

        <!-- S5 to C? -->
        <path d="M750 1110 L750 1165" class="edge"/>

        <!-- C=0 to S0 -->
        <path d="M690 1165 C500 1165, 470 220, 585 220" class="edge"/>
        <text x="550" y="1150" class="label">0</text>

        <!-- C=1 to Y4_n cond then S0 -->
        <path d="M810 1165 L900 1165 L965 1165" class="edge"/>
        <text x="840" y="1150" class="label">1</text>
        <path d="M1110 1165 C1230 1165, 1230 220, 915 220" class="edge"/>

      </svg>
    </div>
  </div>
</body>
</html>
